name: Publish APK to AmsterdamClick Pages

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-apk.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the Pages source
        uses: actions/checkout@v4

      - name: Download and verify the signed APK
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            --output MYTVOnline3.apk \
            "https://github.com/sdigital762-pixel/mytvonline3-risk-reduced-test/releases/download/v12.1.33-enhanced-2/MYTVOnline3.apk"
          echo "E4595BC86DFE3D78DAE7550D9DCD80B2853DD0C6CC951BACEF9CDBB0A2E74804  MYTVOnline3.apk" | sha256sum --check --

      - name: Commit the verified APK to the Pages root
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- MYTVOnline3.apk
          if git diff --cached --quiet; then
            echo "APK is already published."
            exit 0
          fi
          git commit -m "Publish enhanced MYTVOnline3 on AmsterdamClick"
          git push
