name: Publish APK to AmsterdamClick Pages

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-apk.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the Pages source
        uses: actions/checkout@v4

      - name: Download and verify the signed APK
        shell: bash
        run: |
          curl --fail --location --retry 3             --output MYTVOnline3-risk-reduced-1.apk             "https://github.com/sdigital762-pixel/mytvonline3-risk-reduced-test/releases/download/v12.1.33-risk-reduced-1/MYTVOnline3-risk-reduced-1.apk"
          echo "14B10F48FDA9E1B2D29B5A98E064BAF84E9647B698A9BDDF5E21C096F0772611  MYTVOnline3-risk-reduced-1.apk" | sha256sum --check --

      - name: Commit the verified APK to the Pages root
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- MYTVOnline3-risk-reduced-1.apk
          if git diff --cached --quiet; then
            echo "APK is already published."
            exit 0
          fi
          git commit -m "Host verified APK directly on AmsterdamClick"
          git push
